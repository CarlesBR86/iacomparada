name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # reconstruye a diario para publicar artículos con fecha futura
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 24
        env:
          # Para publicar sin dominio en <usuario>.github.io/iacomparada: variables SITE_URL=https://<usuario>.github.io y SITE_BASE=/iacomparada
          SITE_URL: ${{ vars.SITE_URL || 'https://iacomparada.com' }}
          SITE_BASE: ${{ vars.SITE_BASE || '/' }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
